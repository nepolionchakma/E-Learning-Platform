<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0a1a"/>
      <stop offset="0.5" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#ec4899"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <filter id="boxShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="450" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.015" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/><line x1="800" y1="0" x2="800" y2="450"/>
    <line x1="1000" y1="0" x2="1000" y2="450"/>
  </g>

  <!-- ===== HOST / ROOT NAMESPACE PANEL (left) ===== -->
  <g transform="translate(30, 30)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="340" height="230" rx="8" fill="#1a2332" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="340" height="28" rx="8" fill="#1d4ed8"/>
    <rect x="0" y="16" width="340" height="12" fill="#1d4ed8"/>
    <text x="170" y="19" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">ROOT (HOST) NAMESPACE</text>

    <!-- Host physical NIC -->
    <rect x="12" y="36" width="316" height="28" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="0.5"/>
    <text x="22" y="54" fill="#60a5fa" font-family="monospace" font-size="8">eth0</text>
    <text x="170" y="54" fill="#9ca3af" font-family="monospace" font-size="8">192.168.1.100/24</text>
    <text x="280" y="54" fill="#9ca3af" font-family="monospace" font-size="7">NIC</text>

    <!-- IP forwarding indicator -->
    <rect x="12" y="70" width="316" height="20" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="0.5"/>
    <text x="170" y="84" fill="#fbbf24" font-family="monospace" font-size="8" text-anchor="middle">net.ipv4.ip_forward = 1</text>

    <!-- Bridge -->
    <rect x="12" y="96" width="316" height="28" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="0.8"/>
    <rect x="12" y="96" width="50" height="28" rx="4" fill="#0891b2"/>
    <text x="37" y="114" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">br0</text>
    <text x="170" y="114" fill="#67e8f9" font-family="monospace" font-size="8" text-anchor="middle">10.0.0.1/24 — BRIDGE (L2 Switch)</text>

    <!-- NAT rule -->
    <rect x="12" y="130" width="316" height="20" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.5"/>
    <text x="170" y="144" fill="#34d399" font-family="monospace" font-size="7" text-anchor="middle">iptables -t nat -A POSTROUTING -s 10.0.0.0/24 -j MASQUERADE</text>

    <!-- iptables chain -->
    <rect x="12" y="156" width="316" height="20" rx="4" fill="#0f172a" stroke="#8b5cf6" stroke-width="0.5"/>
    <text x="170" y="170" fill="#a78bfa" font-family="monospace" font-size="7" text-anchor="middle">FORWARD: ACCEPT • docker0 bridge available</text>

    <!-- Connection lines going downward from bridge -->
    <line x1="60" y1="188" x2="60" y2="210" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="170" y1="188" x2="170" y2="210" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="280" y1="188" x2="280" y2="210" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3 2"/>

    <!-- veth host endpoints -->
    <rect x="40" y="210" width="40" height="14" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="60" y="220" fill="#9ca3af" font-family="monospace" font-size="6" text-anchor="middle">veth-h1</text>
    <rect x="150" y="210" width="40" height="14" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="170" y="220" fill="#9ca3af" font-family="monospace" font-size="6" text-anchor="middle">veth-h2</text>
    <rect x="260" y="210" width="40" height="14" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <text x="280" y="220" fill="#9ca3af" font-family="monospace" font-size="6" text-anchor="middle">veth-h3</text>
  </g>

  <!-- ===== CONNECTION ARROWS (vertical) ===== -->
  <g>
    <line x1="90" y1="260" x2="90" y2="285" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2"/>
    <polygon points="90,288 85,280 95,280" fill="#06b6d4"/>
    <line x1="200" y1="260" x2="200" y2="285" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2"/>
    <polygon points="200,288 195,280 205,280" fill="#06b6d4"/>
    <line x1="310" y1="260" x2="310" y2="285" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2"/>
    <polygon points="310,288 305,280 315,280" fill="#06b6d4"/>
  </g>

  <!-- ===== THREE ISOLATED NAMESPACES (bottom row) ===== -->
  <!-- Namespace 1 -->
  <g transform="translate(30, 295)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="185" height="115" rx="6" fill="#1a2332" stroke="#06b6d4" stroke-width="0.8"/>
    <rect x="0" y="0" width="185" height="22" rx="6" fill="#0891b2"/>
    <rect x="0" y="14" width="185" height="8" fill="#0891b2"/>
    <text x="92" y="14" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">NAMESPACE: ns1</text>

    <rect x="8" y="28" width="169" height="22" rx="3" fill="#0f172a" stroke="#06b6d4" stroke-width="0.5"/>
    <text x="18" y="43" fill="#67e8f9" font-family="monospace" font-size="7">eth0: 10.0.0.11/24</text>

    <rect x="8" y="54" width="169" height="18" rx="3" fill="#0f172a" stroke="#3b82f6" stroke-width="0.5"/>
    <text x="92" y="66" fill="#60a5fa" font-family="monospace" font-size="7" text-anchor="middle">default via 10.0.0.1</text>

    <rect x="8" y="76" width="169" height="18" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="0.5"/>
    <text x="92" y="88" fill="#34d399" font-family="monospace" font-size="7" text-anchor="middle">lo: UP</text>

    <!-- IPTABLES inside -->
    <rect x="8" y="97" width="169" height="14" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.3"/>
    <text x="92" y="107" fill="#9ca3af" font-family="monospace" font-size="6" text-anchor="middle">iptables: empty</text>
  </g>

  <!-- Namespace 2 -->
  <g transform="translate(230, 295)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="185" height="115" rx="6" fill="#1a2332" stroke="#10b981" stroke-width="0.8"/>
    <rect x="0" y="0" width="185" height="22" rx="6" fill="#059669"/>
    <rect x="0" y="14" width="185" height="8" fill="#059669"/>
    <text x="92" y="14" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">NAMESPACE: ns2</text>

    <rect x="8" y="28" width="169" height="22" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="0.5"/>
    <text x="18" y="43" fill="#6ee7b7" font-family="monospace" font-size="7">eth0: 10.0.0.12/24</text>

    <rect x="8" y="54" width="169" height="18" rx="3" fill="#0f172a" stroke="#3b82f6" stroke-width="0.5"/>
    <text x="92" y="66" fill="#60a5fa" font-family="monospace" font-size="7" text-anchor="middle">default via 10.0.0.1</text>

    <rect x="8" y="76" width="169" height="18" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="0.5"/>
    <text x="92" y="88" fill="#34d399" font-family="monospace" font-size="7" text-anchor="middle">lo: UP</text>

    <rect x="8" y="97" width="169" height="14" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.3"/>
    <text x="92" y="107" fill="#9ca3af" font-family="monospace" font-size="6" text-anchor="middle">iptables: empty</text>
  </g>

  <!-- Namespace 3 -->
  <g transform="translate(430, 295)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="185" height="115" rx="6" fill="#1a2332" stroke="#8b5cf6" stroke-width="0.8"/>
    <rect x="0" y="0" width="185" height="22" rx="6" fill="#6d28d9"/>
    <rect x="0" y="14" width="185" height="8" fill="#6d28d9"/>
    <text x="92" y="14" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">NAMESPACE: ns3</text>

    <rect x="8" y="28" width="169" height="22" rx="3" fill="#0f172a" stroke="#8b5cf6" stroke-width="0.5"/>
    <text x="18" y="43" fill="#c4b5fd" font-family="monospace" font-size="7">eth0: 10.0.0.13/24</text>

    <rect x="8" y="54" width="169" height="18" rx="3" fill="#0f172a" stroke="#3b82f6" stroke-width="0.5"/>
    <text x="92" y="66" fill="#60a5fa" font-family="monospace" font-size="7" text-anchor="middle">default via 10.0.0.1</text>

    <rect x="8" y="76" width="169" height="18" rx="3" fill="#0f172a" stroke="#10b981" stroke-width="0.5"/>
    <text x="92" y="88" fill="#34d399" font-family="monospace" font-size="7" text-anchor="middle">lo: UP</text>

    <rect x="8" y="97" width="169" height="14" rx="3" fill="#0f172a" stroke="#334155" stroke-width="0.3"/>
    <text x="92" y="107" fill="#9ca3af" font-family="monospace" font-size="6" text-anchor="middle">iptables: empty</text>
  </g>

  <!-- ===== TOOLS AND CONCEPTS PANEL (right side) ===== -->
  <g transform="translate(640, 30)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="530" height="230" rx="8" fill="#1a2332" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="530" height="28" rx="8" fill="#0f172a"/>
    <rect x="0" y="16" width="530" height="12" fill="#0f172a"/>
    <text x="265" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">NETWORK NAMESPACE CONCEPTS</text>

    <!-- veth pair concept -->
    <g transform="translate(15, 38)">
      <rect x="0" y="0" width="500" height="60" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="0.5"/>
      <rect x="0" y="0" width="8" height="60" rx="4" fill="#06b6d4"/>
      <text x="20" y="17" fill="#22d3ee" font-family="monospace" font-size="9" font-weight="bold">veth Pairs (Virtual Ethernet Cables)</text>
      <text x="20" y="35" fill="#9ca3af" font-family="monospace" font-size="8">ip link add veth-red type veth peer name veth-blue</text>
      <text x="20" y="50" fill="#9ca3af" font-family="monospace" font-size="8">ip link set veth-blue netns ns1  →  ip addr add 10.0.1.1/24 dev veth-red</text>
    </g>

    <!-- bridge concept -->
    <g transform="translate(15, 106)">
      <rect x="0" y="0" width="500" height="60" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="0.5"/>
      <rect x="0" y="0" width="8" height="60" rx="4" fill="#3b82f6"/>
      <text x="20" y="17" fill="#60a5fa" font-family="monospace" font-size="9" font-weight="bold">Linux Bridge (Virtual L2 Switch)</text>
      <text x="20" y="35" fill="#9ca3af" font-family="monospace" font-size="8">ip link add br0 type bridge  →  ip link set veth-h1 master br0</text>
      <text x="20" y="50" fill="#9ca3af" font-family="monospace" font-size="8">Forwards frames by MAC address (FDB) — connects 3+ namespaces</text>
    </g>

    <!-- NAT/internet concept -->
    <g transform="translate(15, 174)">
      <rect x="0" y="0" width="500" height="48" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="0.5"/>
      <rect x="0" y="0" width="8" height="48" rx="4" fill="#10b981"/>
      <text x="20" y="17" fill="#34d399" font-family="monospace" font-size="9" font-weight="bold">NAT &amp; Internet Access (Masquerade)</text>
      <text x="20" y="33" fill="#9ca3af" font-family="monospace" font-size="8">iptables -t nat -A POSTROUTING -s 10.0.0.0/24 ! -o br0 -j MASQUERADE</text>
      <text x="20" y="46" fill="#9ca3af" font-family="monospace" font-size="8">sysctl -w net.ipv4.ip_forward=1  →  sudo ip netns exec ns1 ping 8.8.8.8</text>
    </g>
  </g>

  <!-- ===== VERTICAL DIVIDER BETWEEN VISUAL AND COMMAND PANEL ===== -->
  <g opacity="0.15">
    <line x1="625" y1="30" x2="625" y2="260" stroke="#ffffff" stroke-width="0.5"/>
    <line x1="627" y1="30" x2="627" y2="260" stroke="#ffffff" stroke-width="0.5"/>
  </g>

  <!-- ===== BOTTOM: USE CASES / REAL-WORLD BAR ===== -->
  <g transform="translate(640, 275)" filter="url(#boxShadow)">
    <rect x="0" y="0" width="530" height="135" rx="8" fill="#1a2332" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="530" height="28" rx="8" fill="#0f172a"/>
    <rect x="0" y="16" width="530" height="12" fill="#0f172a"/>
    <text x="265" y="19" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">REAL-WORLD USE CASES</text>

    <!-- Docker -->
    <g transform="translate(15, 36)">
      <rect x="0" y="0" width="240" height="42" rx="4" fill="#0f172a" stroke="#3b82f6" stroke-width="0.5"/>
      <rect x="0" y="0" width="40" height="42" rx="4" fill="#1d4ed8"/>
      <text x="20" y="24" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">🐳</text>
      <text x="50" y="17" fill="#60a5fa" font-family="monospace" font-size="8" font-weight="bold">Docker Containers</text>
      <text x="50" y="32" fill="#9ca3af" font-family="monospace" font-size="7">Each container = 1 netns via CLONE_NEWNET</text>
    </g>

    <!-- Kubernetes -->
    <g transform="translate(265, 36)">
      <rect x="0" y="0" width="250" height="42" rx="4" fill="#0f172a" stroke="#ec4899" stroke-width="0.5"/>
      <rect x="0" y="0" width="40" height="42" rx="4" fill="#be185d"/>
      <text x="20" y="24" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">⎈</text>
      <text x="50" y="17" fill="#f472b6" font-family="monospace" font-size="8" font-weight="bold">Kubernetes Pods</text>
      <text x="50" y="32" fill="#9ca3af" font-family="monospace" font-size="7">Pod = shared netns via pause container</text>
    </g>

    <!-- VPN Isolation -->
    <g transform="translate(15, 86)">
      <rect x="0" y="0" width="240" height="42" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="0.5"/>
      <rect x="0" y="0" width="40" height="42" rx="4" fill="#059669"/>
      <text x="20" y="24" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">🔒</text>
      <text x="50" y="17" fill="#34d399" font-family="monospace" font-size="8" font-weight="bold">VPN Isolation</text>
      <text x="50" y="32" fill="#9ca3af" font-family="monospace" font-size="7">Isolate VPN traffic from host network</text>
    </g>

    <!-- NFV -->
    <g transform="translate(265, 86)">
      <rect x="0" y="0" width="250" height="42" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="0.5"/>
      <rect x="0" y="0" width="40" height="42" rx="4" fill="#d97706"/>
      <text x="20" y="24" fill="#ffffff" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">⚙️</text>
      <text x="50" y="17" fill="#fbbf24" font-family="monospace" font-size="8" font-weight="bold">Network Function Virtualization</text>
      <text x="50" y="32" fill="#9ca3af" font-family="monospace" font-size="7">Firewalls, NATs, DPIs in isolated namespaces</text>
    </g>
  </g>

  <!-- ===== TITLE ===== -->
  <text x="600" y="435" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="1">Linux Network Namespaces: The Complete Guide</text>
  <text x="600" y="449" fill="#06b6d4" font-family="monospace" font-size="11" text-anchor="middle">ip netns • veth Pairs • Linux Bridge • NAT • Docker • Kubernetes</text>
</svg>
